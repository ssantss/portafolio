    resumen profesional:
      - 'Desarrollador Full Stack con **~5 años construyendo plataformas en producción** para el sector público, PyMEs LatAm y apuestas deportivas reguladas en Colombia. Experto en **Django + Next.js**, con stack secundario en Vue, Svelte y Electron. Hoy lidero una **plataforma de extracción de documentos con IA para la Alcaldía de Pereira** y opero mi propio **SaaS usado por ~130 parqueaderos en 14 países**. Construyo end-to-end: desde APIs RESTful y pipelines con LLMs hasta hardware POS (impresoras térmicas) e integraciones WhatsApp.'
      - Sólidos conocimientos en **Linux, Docker** y administración de sistemas con **Proxmox**. Incorporo activamente **Claude Code y Codex** en mi flujo de trabajo, con prompt engineering aplicado a generación de código, refactoring y code review.
    experiencia profesional:
      - company: DIGER — Alcaldía de Pereira (Contratista)
        position: Líder Full-Stack (Creador y Mantenedor)
        start_date: 2026-08
        end_date: present
        location: Pereira, Colombia
        summary: 'Creé y lidero [digerpereira.com](https://digerpereira.com), la plataforma con la que la Dirección de Gestión del Riesgo digitaliza los formularios de caracterización psicosocial de familias afectadas por emergencias y los reporta al registro nacional de damnificados (RUD/UNGRD). Stack: Django/DRF, Celery, Redis, PostgreSQL, Next.js, React, APIs de Anthropic/Mistral/Gemini.'
        highlights:
          - Diseñé la arquitectura desde el primer commit y lideré un equipo de ~10 contribuidores; autor de **~75% de 690+ commits** y revisé/mergeé 100+ PRs en las primeras 6 semanas.
          - 'Diseñé un **pipeline de extracción con IA sobre formularios escaneados con votación por consenso entre proveedores** (Anthropic, Mistral, Gemini): la confianza sale del acuerdo entre modelos, los campos sin consenso pasan a auditoría humana y cada corrección queda registrada para medir la precisión real.'
          - Hice benchmark de pares de modelos sobre documentos reales para dimensionar 60.000 formularios, eligiendo una configuración proyectada en **~$2.2K USD y 18 h en vez de 179 h (10× más rápido)**.
          - Procesé **46.000+ escaneos** y automaticé la exportación al RUD (**11.000+ familias reportadas**), reemplazando la digitación manual.
          - 'Opero producción: self-hosted con PM2 y Cloudflare Tunnel, 8 workers de extracción en Celery, backups nocturnos, CI en GitHub Actions, JWT con 4 roles y auditoría por campo bajo la Ley 1581 de protección de datos.'
      - company: Parqueadero.app (Fundador)
        position: Fundador y Desarrollador Principal
        start_date: 2025-05
        end_date: present
        location: Pereira, Colombia
        summary: 'Construí y opero [Parqueadero.app](https://parqueadero.app), SaaS de gestión de parqueaderos usado por **~130 parqueaderos activos en 14 países** (~1.600 vehículos por día hábil). Stack: Django/DRF, PostgreSQL, Next.js, React, Material-UI, Capacitor.'
        highlights:
          - 'Único desarrollador del producto end-to-end (1.700+ commits): motor de cobro con 5 modos (por minuto, fracciones, tramos, tarifa plana, pases por horario), mensualidades, convenios con comercios y cierre de turno/caja.'
          - PWA offline-first y **app nativa Android**, con impresión térmica de tickets por Bluetooth/red (ESC/POS) y códigos de salida con código de barras.
          - Multipaís y multilenguaje (moneda, formatos de placa, landing localizada en 15 idiomas); suscripciones SaaS y panel superadmin con **17 clientes pagando**.
          - Suite de pruebas con 150+ archivos de tests de backend y E2E del modo sin red; despliegue con PM2 y Cloudflare Tunnels.
      - company: Vatio Libre (Contractor)
        position: Desarrollador Full-Stack
        start_date: 2026-01
        end_date: present
        location: New Jersey, USA (Remote)
        summary: 'Construí end-to-end el **Tesla Dashboard**, plataforma de gestión y monitoreo de vehículos eléctricos Tesla con integración directa a la Tesla Owner API. Stack: Vue.js, Python (Django), Tesla Owner API, OAuth.'
        highlights:
          - 'Construí el Tesla Dashboard completo desde cero: galería de imágenes con navegación táctil, decodificador interactivo de VIN, sistema de órdenes con timeline logístico y panel de delivery con ETA en tiempo real.'
          - Rediseñé el flujo de autenticación OAuth con Tesla Owner API, simplificando un proceso de 5 pasos a una interfaz basada en fases con monitoreo automático de popup.
          - Lideré el panel de órdenes enriquecido con componentes de financiamiento, tareas de entrega, narrativa compartible (Web Share API) y visor JSON unificado.
          - Implementé sistema de internacionalización completo (español/inglés) con detección automática de idioma.
