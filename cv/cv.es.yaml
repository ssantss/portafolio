          - Lideré módulos en **Next.js** para escalar funcionalidad y mejorar la experiencia de usuario.
          - Implementé **web scraping con Django** para extraer datos de catálogos desde plataformas de e-commerce externas.
          - Refactoricé código legacy migrando de **jQuery a React**, optimizando rendimiento y mantenibilidad del cliente.
